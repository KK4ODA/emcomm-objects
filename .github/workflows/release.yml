name: Release

# Triggers on any tag matching v* (e.g. v0.1.0, v1.2.3-beta.1).
# Build artifacts and the GitHub Release are produced by goreleaser
# per .goreleaser.yaml.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # to create the release and upload assets

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with full history)
        uses: actions/checkout@v4
        with:
          # goreleaser uses git history for changelog generation.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
