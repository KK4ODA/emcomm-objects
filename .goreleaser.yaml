# goreleaser config for emcomm-objects.
# Triggered by `git push --tags` (vX.Y.Z) via .github/workflows/release.yml.
# Local dry-run: `goreleaser release --snapshot --clean --skip=publish`.

version: 2

project_name: emcomm-objects

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/emcomm-objects
    binary: emcomm-objects
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # We don't ship Windows-on-ARM for now; very few Windows ham operators
      # run ARM and the build matrix grows otherwise.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kk4oda/emcomm-objects/internal/version.Version={{.Version}}
      - -X github.com/kk4oda/emcomm-objects/internal/version.Commit={{.ShortCommit}}
      - -X github.com/kk4oda/emcomm-objects/internal/version.BuildDate={{.Date}}

archives:
  - # File-name template mirrors what Graywolf does:
    #   emcomm-objects_0.1.0_linux_x86_64.tar.gz
    #   emcomm-objects_0.1.0_macOS_arm64.tar.gz
    #   emcomm-objects_0.1.0_windows_x86_64.zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - README.md
      - LICENSE
      - config.example.yaml
      - src: internal/web/ui/symbols/COPYRIGHT.md
        dst: SYMBOLS-COPYRIGHT.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999

release:
  github:
    owner: KK4ODA
    name: emcomm-objects
  draft: false
  # Auto-detects pre-release from the tag name (e.g. v0.1.0-beta.1).
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Version }}"
  header: |
    ## emcomm-objects {{ .Version }}

    Companion app for [Graywolf APRS](https://github.com/chrissnell/graywolf):
    create, edit, schedule, and beacon APRS objects via Graywolf's KISS port.
  footer: |
    ## Install

    1. Download the archive for your OS/arch below.
    2. Extract; copy `config.example.yaml` to `config.yaml` and edit (set
       your callsign + Graywolf KISS endpoint).
    3. Run `./emcomm-objects` (Linux/macOS) or `emcomm-objects.exe` (Windows).
    4. Open <http://127.0.0.1:8765> in your browser.

    See `README.md` in the archive for the Graywolf-side KISS interface
    configuration (must be type=TCP server, mode=modem).
